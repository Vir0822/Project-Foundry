<svg width="1100" height="520" viewBox="0 0 1100 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Calculator Smart Contract Concept Map</title>
  <desc id="desc">A conceptual map using different shapes for each system element: user, contract, admin, state, operations, access control, and validation.</desc>
  <defs>
    <style>
      .title { font: 700 26px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #4b5563; }
      .label { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .small { font: 13px 'Segoe UI', Arial, sans-serif; fill: #374151; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .main { fill: #f3e8ff; stroke: #a78bfa; stroke-width: 2; }
      .admin { fill: #eef2ff; stroke: #818cf8; stroke-width: 2; }
      .warning { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2; }
      .test { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
      .arrow-dashed { stroke: #374151; stroke-width: 2; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" class="title">Calculator Smart Contract</text>
  <text x="550" y="70" text-anchor="middle" class="subtitle">Conceptual flow and system overview</text>

  <ellipse cx="160" cy="163" rx="95" ry="46" class="box"/>
  <text x="160" y="158" text-anchor="middle" class="label">User</text>
  <text x="160" y="180" text-anchor="middle" class="small">Wallet or caller</text>

  <rect x="310" y="120" width="220" height="110" rx="18" class="main"/>
  <text x="420" y="155" text-anchor="middle" class="label">Calculator Contract</text>
  <text x="420" y="178" text-anchor="middle" class="small">State + logic + events</text>

  <polygon points="650,120 735,120 790,163 735,206 650,206 595,163" class="admin"/>
  <text x="692" y="158" text-anchor="middle" class="label">Admin</text>
  <text x="692" y="180" text-anchor="middle" class="small">Authorized address</text>

  <rect x="75" y="270" width="240" height="150" rx="18" class="box"/>
  <text x="195" y="300" text-anchor="middle" class="label">Contract State</text>
  <text x="195" y="330" text-anchor="middle" class="small">resultado: uint256</text>
  <text x="195" y="355" text-anchor="middle" class="small">admin: address</text>
  <text x="195" y="380" text-anchor="middle" class="small">emitted events</text>

  <polygon points="385,285 560,285 575,345 560,405 385,405 370,345" class="box"/>
  <text x="472" y="317" text-anchor="middle" class="label">Operations</text>
  <text x="472" y="342" text-anchor="middle" class="small">addition</text>
  <text x="472" y="364" text-anchor="middle" class="small">substraction</text>
  <text x="472" y="386" text-anchor="middle" class="small">multiplier</text>
  <text x="472" y="408" text-anchor="middle" class="small">division</text>

  <polygon points="665,285 885,285 920,345 885,405 665,405 630,345" class="warning"/>
  <text x="775" y="316" text-anchor="middle" class="label">Access Control</text>
  <text x="775" y="340" text-anchor="middle" class="small">division requires</text>
  <text x="775" y="363" text-anchor="middle" class="small">msg.sender == admin</text>
  <text x="775" y="386" text-anchor="middle" class="small">otherwise revert</text>

  <path d="M930 230 L1060 230 L1090 300 L1060 370 L930 370 L900 300 Z" class="test"/>
  <text x="995" y="270" text-anchor="middle" class="label">Validation</text>
  <text x="995" y="295" text-anchor="middle" class="small">Foundry tests</text>
  <text x="995" y="318" text-anchor="middle" class="small">unit checks</text>
  <text x="995" y="341" text-anchor="middle" class="small">revert cases</text>
  <text x="995" y="364" text-anchor="middle" class="small">fuzz tests</text>

  <path d="M255 163 H310" class="arrow"/>
  <path d="M530 163 H595" class="arrow"/>
  <path d="M420 230 V270" class="arrow"/>
  <path d="M560 345 H630" class="arrow"/>
  <path d="M920 345 H930" class="arrow"/>
  <path d="M692 206 V285" class="arrow-dashed"/>

  <text x="420" y="252" text-anchor="middle" class="small">execution</text>
  <text x="598" y="323" text-anchor="middle" class="small">authorized call</text>
  <text x="905" y="323" text-anchor="middle" class="small">checks</text>
  <text x="692" y="260" text-anchor="middle" class="small">admin-only</text>
</svg>
